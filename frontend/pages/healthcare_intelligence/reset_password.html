{% load static %}
<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset password — MediScan AI</title><link rel="stylesheet" href="{% static 'css/landing.css' %}"><link rel="stylesheet" href="{% static 'css/portal.css' %}"></head><body class="light"><main class="reset-form"><a class="portal-brand" href="{% url 'landing' %}">MediScan <b>AI</b></a><h1>Choose a new password</h1>{% if error %}<div class="portal-status error">{{ error }}</div>{% endif %}<form method="post">{% csrf_token %}<div class="portal-field"><label for="password">New password</label><input id="password" name="password" type="password" minlength="8" required autocomplete="new-password"></div><button class="portal-button" type="submit">Update password</button></form></main></body></html>
